name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "00 0 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DOUYIN_STORAGE_STATE: ${{ secrets.DOUYIN_STORAGE_STATE }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Write multi-account configuration
        shell: bash
        env:
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          accounts = []
          for index in range(1, 6):
              config = os.environ.get(f"CONFIG_{index}")
              if not config:
                  continue

              # 验证配置 JSON
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}"
                  ) from exc

              # storage state 直接读仓库里的文件
              storage_file = Path(f"storage-state-account{index}.json")
              if not storage_file.is_file():
                  raise SystemExit(
                      f"仓库中未找到 {storage_file}，请将该文件上传到仓库根目录"
                  )

              env_file = f".env.account{index}"
              Path(env_file).write_text(
                  f"DOUYIN_STORAGE_STATE={storage_file}\n"
                  f"TASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(
                  config, encoding="utf-8"
              )
              accounts.append(
                  {"id": f"account{index}", "enabled": True, "env_file": env_file}
              )

          if not accounts:
              print("未配置多账号 Secret，继续使用旧单账号模式")
              raise SystemExit(0)

          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"已配置 {len(accounts)} 个账号")
          PY
      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
