name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "00 0 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DOUYIN_STORAGE_STATE: ${{ secrets.DOUYIN_STORAGE_STATE }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          STORAGE_1: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT1 }}
          STORAGE_1_P1: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT1_PART1 }}
          STORAGE_1_P2: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT1_PART2 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          STORAGE_2: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT2 }}
          STORAGE_2_P1: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT2_PART1 }}
          STORAGE_2_P2: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT2_PART2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          STORAGE_3: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT3 }}
          STORAGE_3_P1: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT3_PART1 }}
          STORAGE_3_P2: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT3_PART2 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          STORAGE_4: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT4 }}
          STORAGE_4_P1: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT4_PART1 }}
          STORAGE_4_P2: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT4_PART2 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          STORAGE_5: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT5 }}
          STORAGE_5_P1: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT5_PART1 }}
          STORAGE_5_P2: ${{ secrets.DOUYIN_STORAGE_STATE_ACCOUNT5_PART2 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
          LEGACY_STORAGE: ${{ secrets.DOUYIN_STORAGE_STATE }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def _resolve_storage(index: int) -> str | None:
              """读取单块或拼接两块 storage state secret。"""
              single = os.environ.get(f"STORAGE_{index}")
              if single:
                  return single
              part1 = os.environ.get(f"STORAGE_{index}_P1")
              part2 = os.environ.get(f"STORAGE_{index}_P2")
              if part1 and part2:
                  return part1 + part2
              return None

          has_multi = any(
              os.environ.get(f"COOKIE_{i}") or _resolve_storage(i)
              for i in range(1, 6)
          )
          if not has_multi:
              print("未配置多账号 Secret，继续使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not (
                  os.environ.get("COOKIE_1")
                  or os.environ.get("CONFIG_1")
                  or _resolve_storage(1)
              ):
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
                  storage = os.environ.get("LEGACY_STORAGE")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
                  storage = _resolve_storage(index)

              if not cookie and not config and not storage:
                  continue

              if not config:
                  raise SystemExit(
                      f"账号 account{index} 缺少 DOUYIN_CONFIG_ACCOUNT{index}"
                  )
              if not cookie and not storage:
                  raise SystemExit(
                      f"账号 account{index} 必须配置 DOUYIN_COOKIE_ACCOUNT{index} "
                      f"或 DOUYIN_STORAGE_STATE_ACCOUNT{index} 至少一项"
                  )

              if cookie:
                  try:
                      json.loads(cookie)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(
                          f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}"
                      ) from exc
              if storage:
                  try:
                      json.loads(storage)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(
                          f"DOUYIN_STORAGE_STATE_ACCOUNT{index} 不是有效 JSON: {exc}"
                      ) from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}"
                  ) from exc

              env_file = f".env.account{index}"
              lines = [f"TASK_CONFIG=config/tasks/account{index}.json"]
              if cookie:
                  lines.insert(0, f"DOUYIN_COOKIE={json.dumps(cookie)}")
              if storage:
                  lines.append(f"DOUYIN_STORAGE_STATE={json.dumps(storage)}")
              Path(env_file).write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              Path(f"config/tasks/account{index}.json").write_text(
                  config, encoding="utf-8"
              )
              accounts.append(
                  {"id": f"account{index}", "enabled": True, "env_file": env_file}
              )

          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
